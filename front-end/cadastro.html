<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Internos - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="centro">
    <div class="cartao">
        <h1>Criar Conta</h1>
        <form id="formCadastro">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="crie uma senha (mín. 6)" required minlength="6">

            <label for="confirma">Confirmar senha</label>
            <input type="password" id="confirma" placeholder="repita a senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p class="link-centro">
            Já tem conta? <a href="index.html">Entrar</a>
        </p>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            const senha = document.getElementById('senha').value;
            const confirma = document.getElementById('confirma').value;
            if (senha !== confirma) { alert('Senhas diferentes!'); return; }
            if (senha.length < 6) { alert('Senha muito curta!'); return; }
            alert('Conta criada!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
